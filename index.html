<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yadavas Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Mukta', sans-serif;
      background: linear-gradient(135deg, #f7f7f7, #e0ecff);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #3a4d7a;
      color: white;
      padding: 1.5rem;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #2c3e50;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.2rem;
      color: #555;
      max-width: 600px;
    }
    footer {
      background-color: #3a4d7a;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    Yadavas Website
  </header>
  <main>
    <h1>Welcome</h1>
    <p>
      This is the beginning of something meaningful. Stay connected as this space grows with knowledge, tools, and ideas.
    </p>
  </main>
  <footer>
    &copy; 2025 yadavas.website — All rights reserved.
  </footer>
</body>
</html>
