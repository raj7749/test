<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to Yadavas</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 80px 20px 40px;
    }
    h1 {
      font-size: 3em;
      margin: 0;
    }
    p {
      font-size: 1.3em;
      opacity: 0.9;
      margin-top: 10px;
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      opacity: 0.6;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>👋 Welcome to Yadavas</h1>
    <p>Hi, I'm <strong>Raj</strong> 🙏<br>This is the home of the Yadava family 🏡</p>
  </header>

  <footer>
    🌐 &copy; 2025 Yadavas. All rights reserved.
  </footer>
</body>
</html>
